# RT_70 : PostgreSQL de développement et base de test séparée.
# PostgreSQL 18 : le volume se monte sur /var/lib/postgresql (et non plus
# /var/lib/postgresql/data), l'image y range ses données par version majeure.
name: windfall-planner-api

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: windfall
      POSTGRES_PASSWORD: windfall
      POSTGRES_DB: windfall
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windfall -d windfall"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Base jetable des tests d'intégration (DATABASE_URL_TEST), en mémoire.
  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: windfall
      POSTGRES_PASSWORD: windfall
      POSTGRES_DB: windfall_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windfall -d windfall_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
